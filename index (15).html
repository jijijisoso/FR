<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리끼리 아지트</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#fdf9fa;--ink:#5c4c5f;--muted:#a698a8;--line:#f0e3e8;--pink:#e98aa6;--pink2:#fdeaf0;--lav:#f1ecfb;--lavd:#8f7bb8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
.app{max-width:680px;margin:auto;padding:0 16px 96px}
header{padding:26px 2px 14px}
header h1{margin:0;font-size:26px;letter-spacing:-.5px}
header p{margin:3px 0 14px;font-size:14px;color:var(--muted)}
.chars{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.ch{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 7px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:13px;color:var(--ink)}
.ch img{width:28px;height:28px;border-radius:50%;object-fit:cover;display:block;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ch.on{border-color:var(--pink);background:var(--pink2)}
.page{display:none}.page.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;position:relative}
.card.soft{background:var(--lav);border-color:#e6def6}
h2{font-size:16px;margin:0 0 10px}
.sub{font-size:13px;color:var(--muted)}
.field{width:100%;padding:10px 13px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:14px}
.field:focus{border-color:var(--pink)}
textarea.field{resize:vertical;min-height:76px}
.btn{background:var(--pink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;width:100%}
.btn.ghost{background:#fff;color:var(--pink);border:1.5px solid var(--pink)}
.btn:active{opacity:.85}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;margin:0 6px 6px 0;color:var(--muted)}
.chip.on{background:var(--pink2);border-color:var(--pink);color:var(--pink)}
.stamp{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px 2px 3px;font-size:12px;margin-right:6px;color:#5c4c5f;vertical-align:middle}
.stamp img{width:20px;height:20px;border-radius:50%;object-fit:cover;display:block}
.tag{display:inline-block;background:var(--lav);color:var(--lavd);border-radius:99px;padding:2px 10px;font-size:12px;margin-right:6px}
.del{position:absolute;right:12px;top:10px;background:none;color:#cdbfcb;font-size:14px}
.date-h{margin:20px 2px 8px;font-size:13px;color:var(--lavd)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.photo{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.photo img{width:100%;height:110px;object-fit:cover;display:block}
.photo span{display:block;font-size:12px;padding:5px 8px;overflow-wrap:anywhere}
.cap-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.cap-row img{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}.cap-row .field{margin:0}
.cmt{font-size:13px;background:var(--bg);border-radius:10px;padding:6px 10px;margin-top:6px}
.row{display:flex;gap:6px}.row .field{margin-bottom:0}.row .btn{width:auto;flex:none;padding:8px 14px;font-size:13px}
.heart{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:3px 12px;font-size:13px;margin-top:8px}
.quote{margin-top:8px;padding:8px 12px;border-left:3px solid var(--pink);background:var(--pink2);border-radius:0 10px 10px 0;font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:6px 8px max(8px,env(safe-area-inset-bottom));background:#fffffff2;border-top:1px solid var(--line);z-index:5}
.nav button{flex:1;max-width:100px;background:none;color:var(--muted);font-size:11px;padding:4px 2px;border-radius:12px}
.nav button i{display:block;font-style:normal;font-size:19px}.nav button.on{color:var(--pink);background:var(--pink2)}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

.hero{margin:6px 0 4px;border-radius:22px;background:linear-gradient(135deg,#ffe3ea,#fff3c9 55%,#dff5e6);border:1.5px solid #f6dfe6;padding:14px 14px 0;overflow:hidden}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hero-top img{height:92px;width:auto;flex:none;display:block}
.hero-txt{flex:1;text-align:center;align-self:center;padding-bottom:10px}
.hero-txt h1{margin:0;font-size:24px}
.hero-txt p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.hero .group{display:block;width:calc(100% + 28px);margin:6px -14px 0;max-width:none;height:auto}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 14px;padding:12px 16px;border-radius:18px;background:var(--bb);border:1.5px solid var(--a);position:relative;overflow:hidden;min-height:76px}
.banner b{font-size:18px;display:block}.banner small{font-size:12px;color:var(--muted)}
.banner img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--a);position:relative;z-index:1;flex:none}
.banner .mo{position:absolute;right:84px;top:8px;font-size:15px;letter-spacing:6px;opacity:.5}
#home{--a:#f28aa5;--bb:#fff0f3}#guest{--a:#7fcf94;--bb:#effaf1}#album{--a:#f2a65a;--bb:#fff4e6}#diary{--a:#f5cf5a;--bb:#fffbe6;--bt:#5f4a00}#cap{--a:#b79be0;--bb:#f5eefc}
.page .btn:not(.ghost){background:var(--a);color:var(--bt,#fff)}
.page .card{border-left:4px solid var(--a)}
.page .field:focus{border-color:var(--a)}
.page .chip.on{border-color:var(--a);background:var(--bb);color:var(--ink)}
.page .quote{border-left-color:var(--a);background:var(--bb)}
</style>
</head>
<body>
<div class="app">
<header><h1 id="brand">우리끼리 아지트</h1><p>우리의 추억을 담는 곳</p></header>

<section class="page on" id="home">
 <div class="banner"><div><b>어서와!</b><small>리본처럼 곱게 모아두기</small></div><span class="mo">✨ ⭐</span><img data-img="kitty" alt=""></div>
 <div class="card"><h2>아지트 이름</h2><div class="row"><input class="field" id="room" placeholder="아지트 이름"><button class="btn" id="room-save">변경</button></div></div>
 <div class="card"><h2>내 프로필</h2><div class="sub" style="margin-bottom:8px">내 캐릭터를 고르고 이름을 적어줘. 글을 쓰면 이 캐릭터 스탬프가 붙어!</div>
  <div class="chars" id="chars" style="margin-bottom:8px"></div><div class="row"><input class="field" id="me-name" placeholder="내 이름 또는 별명"><button class="btn" id="me-save">저장</button></div></div>
 <div class="card soft"><h2>1년 전 오늘</h2><div id="ago"></div></div>
 <div class="card"><h2>타임캡슐 알림</h2><div id="capnote"></div></div>
 <div class="card"><h2>우리의 기록</h2><div class="sub" id="stats"></div></div>
 <div class="card"><h2>백업</h2><div class="sub" style="margin-bottom:8px">기록을 파일로 내려받거나 다시 불러올 수 있어.</div>
  <div class="row"><button class="btn ghost" id="exp">백업 저장</button><button class="btn ghost" id="imp">백업 불러오기</button></div>
  <input type="file" id="impf" accept=".json" hidden><div class="status" id="status"></div></div>
</section>

<section class="page" id="guest">
 <div class="banner"><div><b>방명록</b><small>폴짝, 한마디 남기고 가기</small></div><span class="mo">✨ 🍀</span><img data-img="keroppi" alt=""></div>
 <div class="card"><h2>방명록 남기기</h2><div id="g-type"></div>
  <input class="field" id="g-name" placeholder="이름 (비워두면 익명)">
  <textarea class="field" id="g-text" placeholder="친구에게 하고 싶은 말을 적어줘"></textarea>
  <button class="btn" id="g-add">남기기</button></div>
 <div id="g-list"></div>
</section>

<section class="page" id="album">
 <div class="banner"><div><b>사진첩</b><small>토끼 귀처럼 쫑긋, 순간 담기</small></div><span class="mo">✨ 📷</span><img data-img="bunny" alt=""></div>
 <div class="card"><h2>앨범 만들기</h2>
  <input class="field" id="a-title" placeholder="앨범 제목">
  <input class="field" type="date" id="a-date">
  <input class="field" type="file" id="a-files" accept="image/*" multiple>
  <div id="a-prev"></div><button class="btn" id="a-add">앨범 저장</button></div>
 <div id="a-list"></div>
</section>

<section class="page" id="diary">
 <div class="banner"><div><b>일기</b><small>푸딩처럼 말랑한 하루</small></div><span class="mo">✨ ⭐</span><img data-img="purin" alt=""></div>
 <div class="card"><h2>오늘의 일기</h2>
  <input class="field" type="date" id="d-date">
  <div class="sub" style="margin-bottom:6px">오늘의 기분</div><div id="d-mood"></div>
  <textarea class="field" id="d-text" placeholder="오늘 있었던 일"></textarea>
  <input class="field" id="d-quote" placeholder="기억하고 싶은 말 (선택)">
  <button class="btn" id="d-add">일기 저장</button></div>
 <div id="d-list"></div>
</section>

<section class="page" id="cap">
 <div class="banner"><div><b>타임캡슐</b><small>미래로 폴짝, 편지 배달</small></div><span class="mo">✨ 💌</span><img data-img="frog" alt=""></div>
 <div class="card soft"><h2>미래의 우리에게</h2>
  <input class="field" id="c-name" placeholder="보내는 사람">
  <div class="sub" style="margin-bottom:5px">열리는 날짜</div><input class="field" type="date" id="c-open">
  <textarea class="field" id="c-text" placeholder="미래의 우리에게 편지를 써줘"></textarea>
  <button class="btn" id="c-add">타임캡슐 묻기</button></div>
 <div id="c-list"></div>
</section>
</div>

<nav class="nav" id="nav">
 <button class="on" data-p="home"><i>🏠</i>홈</button><button data-p="guest"><i>💌</i>방명록</button><button data-p="album"><i>📷</i>사진첩</button><button data-p="diary"><i>📓</i>일기</button><button data-p="cap"><i>⏳</i>타임캡슐</button>
</nav>

<script>
/* ===== 1) 저장소 설정 =====
 FIREBASE_CONFIG를 채우면 친구들과 실시간 공유(클라우드 저장),
 비워두면 이 기기 브라우저에만 저장(localStorage)돼. */
const FIREBASE_CONFIG={apiKey:"",authDomain:"",projectId:"",appId:""};

(()=>{
const $=id=>document.getElementById(id);
const COLS=['guests','albums','diaries','caps'],KEY='ourHangout_v3',MEKEY='ourHangout_me';
const cloud=!!FIREBASE_CONFIG.apiKey&&typeof firebase!=='undefined';
let D={meta:{room:'우리끼리 아지트'},guests:[],albums:[],diaries:[],caps:[]},db;
let me={n:'',c:0};
try{const s=JSON.parse(localStorage.getItem(MEKEY)||'null');if(s)me=s}catch(e){}

/* ===== 2) 저장 함수 (로컬/클라우드 공통) ===== */
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){alert('저장 공간이 가득 찼어. 사진 수를 줄이거나 백업 후 정리해줘!')}};
function put(col,item){
 if(JSON.stringify(item).length>900000)return alert('사진 용량이 너무 커. 장수를 줄여줘!');
 if(cloud){db.collection(col).doc(item.id).set(item).catch(e=>alert('저장 실패: '+e.message))}
 else{const i=D[col].findIndex(x=>x.id===item.id);i<0?D[col].push(item):D[col][i]=item;saveLocal();render()}}
function rm(col,id){if(cloud)db.collection(col).doc(id).delete();else{D[col]=D[col].filter(x=>x.id!==id);saveLocal();render()}}
function setMeta(p){D.meta={...D.meta,...p};if(cloud)db.collection('meta').doc('main').set(D.meta);else{saveLocal();render()}}
if(cloud){
 firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
 COLS.forEach(c=>db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>d.data());render()}));
 db.collection('meta').doc('main').onSnapshot(d=>{if(d.exists)D.meta={...D.meta,...d.data()};render()});
}else{try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)D={...D,...s}}catch(e){}}

const C=[{n:'헬로키티',k:'kitty',c:'#ffd3de'},{n:'케로피',k:'keroppi',c:'#d3f0da'},{n:'폼폼푸린',k:'purin',c:'#fff0b3'},{n:'개구리',k:'frog',c:'#cdebd6'},{n:'고양이',k:'cat',c:'#ffe2b8'},{n:'노랑이',k:'mouse',c:'#fff3b0'},{n:'햄스터',k:'hamster',c:'#ece6e2'},{n:'강아지',k:'dog',c:'#fbdcb8'},{n:'토끼',k:'bunny',c:'#f1e4fa'}];
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const T=iso(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kd=s=>{const [y,m,d]=s.split('-');return `${y}년 ${+m}월 ${+d}일`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const stamp=i=>{const k=C[i]||C[0];return `<span class="stamp" style="background:${k.c}"><img src="${IMG[k.k]}" alt="">${k.n}</span>`};
const group=(arr,f)=>{const m={};arr.forEach(x=>(m[f(x)]??=[]).push(x));return Object.keys(m).sort().reverse().map(k=>[k,m[k].sort((a,b)=>(b.ts||0)-(a.ts||0))])};
const del=(k,id)=>`<button class="del" data-k="${k}" data-id="${id}">✕</button>`;
let gType='생일 축하',mood='🥰',photos=[];
$('a-date').value=$('d-date').value=T;

function drawTop(){
 $('chars').innerHTML=C.map((k,i)=>`<button class="ch ${i===me.c?'on':''}" data-c="${i}"><img src="${IMG[k.k]}" alt="">${k.n}</button>`).join('');
 const ch=(el,list,cur,fn)=>{$(el).innerHTML=list.map(x=>`<button class="chip ${x===cur?'on':''}" data-v="${x}">${x}</button>`).join('');$(el).querySelectorAll('button').forEach(b=>b.onclick=()=>fn(b.dataset.v))};
 ch('g-type',['생일 축하','응원','편지','그냥'],gType,v=>{gType=v;drawTop()});
 ch('d-mood',['🥰','😆','😊','😴','😢','😡'],mood,v=>{mood=v;drawTop()});
 $('chars').querySelectorAll('button').forEach(b=>b.onclick=()=>{me.c=+b.dataset.c;localStorage.setItem(MEKEY,JSON.stringify(me));drawTop()});
}

/* ===== 4) 화면 그리기 ===== */
function render(){
 const M=D.meta;$('brand').textContent=M.room;$('room').value=M.room;
 const md=T.slice(5),yr=+T.slice(0,4),ago=[],same=a=>a.date.slice(5)===md&&+a.date.slice(0,4)<yr;
 D.albums.filter(same).forEach(a=>ago.push(`📷 ${esc(a.title)} · ${kd(a.date)}`));
 D.diaries.filter(same).forEach(a=>ago.push(`📓 ${esc(a.mood)} ${esc(a.text.slice(0,40))} · ${kd(a.date)}`));
 D.guests.filter(same).forEach(a=>ago.push(`💌 ${esc(a.name)}: ${esc(a.text.slice(0,40))} · ${kd(a.date)}`));
 $('ago').innerHTML=ago.length?ago.map(x=>`<div class="cmt">${x}</div>`).join(''):'<div class="sub">아직 1년 전 기록이 없어. 오늘 남긴 기록이 내년에 돌아올 거야.</div>';
 const ready=D.caps.filter(c=>c.open<=T),wait=D.caps.filter(c=>c.open>T).map(c=>c.open).sort();
 $('capnote').innerHTML=(ready.length?`<div class="cmt">열어볼 수 있는 캡슐 ${ready.length}개</div>`:'')+(wait.length?`<div class="sub" style="margin-top:6px">다음 캡슐은 ${kd(wait[0])}에 열려</div>`:(ready.length?'':'<div class="sub">묻어둔 캡슐이 없어</div>'));
 $('stats').textContent=`방명록 ${D.guests.length} · 앨범 ${D.albums.length} · 일기 ${D.diaries.length} · 캡슐 ${D.caps.length}`;
 $('status').textContent=cloud?'☁️ 친구들과 실시간 공유 중':'📱 이 기기에만 저장 중 (공유하려면 FIREBASE_CONFIG 설정)';
 $('me-name').value=me.n||'';if(me.n){$('g-name').value=$('g-name').value||me.n;$('c-name').value=$('c-name').value||me.n}
 $('g-list').innerHTML=D.guests.length?group(D.guests,g=>g.date).map(([d,l])=>`<div class="date-h">${kd(d)}</div>`+l.map(g=>`<div class="card">${del('guests',g.id)}${stamp(g.ch)}<span class="tag">${esc(g.type)}</span><b>${esc(g.name)}</b><div style="margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(g.text)}</div></div>`).join('')).join(''):'<div class="empty">첫 방명록을 기다리고 있어</div>';
 $('a-list').innerHTML=D.albums.length?group(D.albums,a=>a.date).map(([d,l])=>`<div class="date-h">${kd(d)}</div>`+l.map(a=>`<div class="card">${del('albums',a.id)}${stamp(a.ch)}<b>${esc(a.title)}</b><div class="photos">${a.photos.map(p=>`<div class="photo"><img src="${p.src}" alt=""><span>${esc(p.cap)}</span></div>`).join('')}</div></div>`).join('')).join(''):'<div class="empty">첫 앨범을 만들어봐</div>';
 $('d-list').innerHTML=D.diaries.length?group(D.diaries,a=>a.date).map(([d,l])=>`<div class="date-h">${kd(d)}</div>`+l.map(a=>`<div class="card">${del('diaries',a.id)}${stamp(a.ch)}<span class="tag">기분 ${esc(a.mood)}</span><b>${esc(a.name||'')}</b><div style="margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(a.text)}</div>${a.quote?`<div class="quote">${esc(a.quote)}</div>`:''}<button class="heart" data-like="${a.id}">💗 공감 ${a.likes||0}</button>${(a.cmts||[]).map(c=>`<div class="cmt"><b>${esc(c.n)}</b> ${esc(c.t)}</div>`).join('')}<div class="row" style="margin-top:8px"><input class="field" id="cn-${a.id}" placeholder="이름" style="max-width:84px" value="${esc(me.n)}"><input class="field" id="ct-${a.id}" placeholder="댓글"><button class="btn" data-cmt="${a.id}">등록</button></div></div>`).join('')).join(''):'<div class="empty">오늘의 첫 일기를 써봐</div>';
 $('c-list').innerHTML=D.caps.length?D.caps.slice().sort((a,b)=>a.open.localeCompare(b.open)).map(c=>{const ok=c.open<=T;return `<div class="card ${ok?'':'soft'}">${del('caps',c.id)}${stamp(c.ch)}<span class="tag">${ok?'열림':'D-'+days(T,c.open)}</span><b>${esc(c.name||'익명')}</b><div class="sub">${kd(c.open)} 공개 · 작성 ${kd(c.created)}</div>${ok?`<div style="margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(c.text)}</div>`:'<div class="sub" style="margin-top:8px">🔒 그날까지 비밀이야</div>'}</div>`}).join(''):'<div class="empty">미래의 우리에게 첫 편지를 써봐</div>';
}

/* ===== 5) 이벤트 ===== */
const find=(col,id)=>D[col].find(x=>x.id===id);
document.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.k&&confirm('정말 지울까?'))rm(t.dataset.k,t.dataset.id);
 if(t.dataset.like){const a=find('diaries',t.dataset.like);put('diaries',{...a,likes:(a.likes||0)+1})}
 if(t.dataset.cmt){const id=t.dataset.cmt,txt=$('ct-'+id).value.trim();if(!txt)return alert('댓글을 적어줘!');const a=find('diaries',id);put('diaries',{...a,cmts:[...(a.cmts||[]),{n:$('cn-'+id).value.trim()||'익명',t:txt}]})}});
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));scrollTo(0,0)});
$('room-save').onclick=()=>{const n=$('room').value.trim();if(n)setMeta({room:n})};
$('me-save').onclick=()=>{me.n=$('me-name').value.trim();localStorage.setItem(MEKEY,JSON.stringify(me));$('g-name').value=me.n;$('c-name').value=me.n;render()};
$('g-add').onclick=()=>{const t=$('g-text').value.trim();if(!t)return alert('메시지를 적어줘!');put('guests',{id:uid(),ts:Date.now(),ch:me.c,type:gType,name:$('g-name').value.trim()||'익명',text:t,date:T});$('g-text').value=''};
function shrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};i.src=r.result};r.readAsDataURL(f)})}
$('a-files').onchange=async e=>{photos=[];for(const f of [...e.target.files].slice(0,8))photos.push({src:await shrink(f),cap:''});$('a-prev').innerHTML=photos.map((p,i)=>`<div class="cap-row"><img src="${p.src}" alt=""><input class="field" data-cap="${i}" placeholder="사진 설명"></div>`).join('');$('a-prev').querySelectorAll('[data-cap]').forEach(x=>x.oninput=()=>photos[x.dataset.cap].cap=x.value)};
$('a-add').onclick=()=>{if(!photos.length)return alert('사진을 골라줘! (최대 8장)');put('albums',{id:uid(),ts:Date.now(),ch:me.c,title:$('a-title').value.trim()||'이름 없는 앨범',date:$('a-date').value||T,photos});photos=[];$('a-prev').innerHTML='';$('a-files').value='';$('a-title').value=''};
$('d-add').onclick=()=>{const t=$('d-text').value.trim();if(!t)return alert('오늘 있었던 일을 적어줘!');put('diaries',{id:uid(),ts:Date.now(),ch:me.c,name:me.n||'',date:$('d-date').value||T,mood,text:t,quote:$('d-quote').value.trim(),likes:0,cmts:[]});$('d-text').value='';$('d-quote').value=''};
$('c-add').onclick=()=>{const t=$('c-text').value.trim(),o=$('c-open').value;if(!t||!o)return alert('날짜와 편지를 모두 적어줘!');if(o<=T)return alert('내일 이후 날짜로 정해줘');put('caps',{id:uid(),ts:Date.now(),ch:me.c,name:$('c-name').value.trim(),open:o,text:t,created:T});$('c-text').value='';$('c-open').value=''};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='hangout-backup-'+T+'.json';a.click()};
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);COLS.forEach(c=>(s[c]||[]).forEach(x=>put(c,x)));if(s.meta)setMeta(s.meta);alert('불러왔어!')}catch(err){alert('올바른 백업 파일이 아니야')}};r.readAsText(f)};
drawTop();render();
})();
</script>
